name: Ark-x build and publish deployment image

on:
  push:
    branches: [deploy/arkx]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: arkx-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment definitions
        run: |
          docker compose --project-directory . --env-file deploy/arkx/.env.example -f deploy/arkx/compose.production.yaml config --quiet
          docker compose --project-directory . --env-file deploy/arkx/.env.example -f deploy/arkx/compose.rehearsal.yaml config --quiet
          python3 deploy/arkx/preflight.py
          sh -n deploy/arkx/runtime-start.sh
          bash -n deploy/arkx/pull-image.sh
          bash -n deploy/arkx/start-stack.sh
          node --check deploy/arkx/prepare-compose.cjs
      - name: Prove private files are excluded from the build context
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          test ! -e .env.context-probe
          test ! -e deploy/arkx/.env.context-probe
          test ! -e deploy/arkx/context-probe.key
          printf 'synthetic-context-probe' > .env.context-probe
          printf 'synthetic-context-probe' > deploy/arkx/.env.context-probe
          printf 'synthetic-context-probe' > deploy/arkx/context-probe.key
          printf 'FROM scratch\nCOPY . /source\n' > "$RUNNER_TEMP/context-probe.Dockerfile"
          docker build --file "$RUNNER_TEMP/context-probe.Dockerfile" --output "type=local,dest=$RUNNER_TEMP/context-export" .
          test ! -e "$RUNNER_TEMP/context-export/source/.env.context-probe"
          test ! -e "$RUNNER_TEMP/context-export/source/deploy/arkx/.env.context-probe"
          test ! -e "$RUNNER_TEMP/context-export/source/deploy/arkx/context-probe.key"
          test -f "$RUNNER_TEMP/context-export/source/.env.example"
          test -f "$RUNNER_TEMP/context-export/source/deploy/arkx/.env.example"
          rm .env.context-probe deploy/arkx/.env.context-probe deploy/arkx/context-probe.key
      - name: Build the source without production credentials
        env:
          IMAGE: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --file Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=v2.25.3 \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --label org.opencontainers.image.source=https://github.com/Ark-x-AI-Lab/postiz-app \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            --tag "$IMAGE" .
      - name: Prove Prisma is usable offline in the runtime image
        env:
          IMAGE: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
        run: |
          ENGINE_CHECK=$(python3 -c "import importlib.util; s=importlib.util.spec_from_file_location('rehearsal', 'deploy/arkx/rehearse-migration.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(m.toolcheck_program())")
          ENGINE_RESULT=$(docker run --rm --network none --read-only --user 65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint node "$IMAGE" -e "$ENGINE_CHECK")
          test "$ENGINE_RESULT" = TOOLS_OK
          docker run --rm --network none --read-only --user 65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint node "$IMAGE" /app/node_modules/prisma/build/index.js --version
      - name: Prove service environment separation in the built image
        env:
          IMAGE: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
        run: |
          python3 -c "import json; x=json.load(open('deploy/arkx/compose.production.yaml')); [s.update(env_file=['.env']) for s in x['services'].values()]; json.dump(x, open('$RUNNER_TEMP/injected-compose.json','w'))"
          docker run --rm -i --network none --read-only --user 65534:65534 \
            --cap-drop=ALL --security-opt no-new-privileges --entrypoint node "$IMAGE" \
            /app/deploy/arkx/prepare-compose.cjs < "$RUNNER_TEMP/injected-compose.json" > "$RUNNER_TEMP/prepared-compose.json"
          python3 -c "import json; assert json.load(open('$RUNNER_TEMP/prepared-compose.json')) == json.load(open('deploy/arkx/compose.production.yaml'))"
      - name: Publish the commit image to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/arkx-publish-docker"
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          docker push "$IMAGE"
