name: Ark-x build and publish deployment image

on:
  push:
    branches: [deploy/arkx]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: arkx-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      MAX_IMAGE_ARCHIVE_BYTES: ${{ vars.ARKX_MAX_IMAGE_ARCHIVE_BYTES || '5000000000' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment definitions
        run: |
          docker compose --project-directory . --env-file deploy/arkx/.env.example -f deploy/arkx/compose.production.yaml config --quiet
          docker compose --project-directory . --env-file deploy/arkx/.env.example -f deploy/arkx/compose.rehearsal.yaml config --quiet
          python3 deploy/arkx/test_build_inputs.py
          python3 deploy/arkx/preflight.py
          sh -n deploy/arkx/runtime-start.sh
          bash -n deploy/arkx/pull-image.sh
          bash -n deploy/arkx/start-stack.sh
          node --check deploy/arkx/prepare-compose.cjs
          node --check deploy/arkx/ecosystem.config.cjs
      - name: Check Temporal defaults and Coolify network separation
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { prepare } = require('./deploy/arkx/prepare-compose.cjs');
          const source = JSON.parse(fs.readFileSync('deploy/arkx/compose.production.yaml', 'utf8'));
          const routing = '1alwcyoouzoa5mf1jrnfzm87';
          const run = data => prepare(JSON.stringify(data), JSON.parse);
          const injected = () => {
            const data = structuredClone(source);
            data.networks[routing] = { name: routing, external: true };
            for (const service of Object.values(data.services)) {
              service.env_file = ['.env'];
              service.networks = Object.fromEntries([...service.networks, routing].map(name => [name, null]));
              service.labels = { 'synthetic.routing': 'retained' };
            }
            return data;
          };
          assert.deepEqual(run(source), source);
          for (const asArray of [false, true]) {
            const data = injected();
            if (asArray) for (const service of Object.values(data.services)) service.networks = Object.keys(service.networks);
            const expected = structuredClone(data);
            for (const [name, service] of Object.entries(expected.services)) {
              delete service.env_file;
              if (name !== 'postiz') {
                if (asArray) service.networks = service.networks.filter(name => name !== routing);
                else delete service.networks[routing];
              }
            }
            assert.deepEqual(run(data), expected);
          }
          // Check the actual Compose-normalized shape, including zero Temporal mounts.
          const { execFileSync } = require('node:child_process');
          const normalized = JSON.parse(execFileSync('docker', ['compose', '--project-directory', '.',
            '--env-file', 'deploy/arkx/.env.example', '-f', 'deploy/arkx/compose.production.yaml',
            '--profile', 'production', 'config', '--format', 'json'], { encoding: 'utf8' }));
          assert.deepEqual(run(normalized), normalized);
          assert.equal(normalized.services.temporal.environment.DYNAMIC_CONFIG_FILE_PATH, 'config/dynamicconfig/docker.yaml');
          assert.equal((normalized.services.temporal.volumes || []).length, 0);
          const blocked = [
            data => { data.services.temporal.environment.DYNAMIC_CONFIG_FILE_PATH = 'config/dynamicconfig/development-sql.yaml'; },
            data => { data.services.temporal.volumes = ['./missing:/etc/temporal/config/dynamicconfig:ro']; },
            data => { data.services.temporal.volumes = [{ type: 'bind', source: '/missing', target: '/etc/temporal/config/dynamicconfig' }]; },
            data => { data.services.temporal.volumes = ['defaults:/etc/temporal/config']; },
            data => { data.services.temporal.image = 'temporalio/auto-setup:latest'; },
            data => { data.services.temporal.networks['app-egress'] = null; },
            data => { delete data.services.temporal.networks['temporal-network']; },
            data => { data.services.temporal.networks.unknown = null; },
            data => { data.services.temporal.network_mode = 'host'; },
            data => { data.networks[routing].external = false; },
            data => { data.networks[routing].name = 'unrelated'; },
            data => { data.networks[routing].internal = false; },
            data => { data.networks.unknown = { external: true, name: 'unknown' }; delete data.networks[routing]; },
            data => { data.networks['2alwcyoouzoa5mf1jrnfzm87'] = { external: true, name: '2alwcyoouzoa5mf1jrnfzm87' }; },
            data => { data.networks['temporal-network'].internal = false; },
            data => { delete data.services.postiz.networks[routing]; },
            data => { data.services.temporal.env_file = ['unexpected.env']; },
            data => { data.services.temporal.environment.JWT_SECRET = 'synthetic'; },
            data => { data.services.postiz.profiles = []; },
          ];
          for (const mutate of blocked) {
            const data = injected();
            mutate(data);
            assert.throws(() => run(data));
          }
          console.log(`PASS: 4 allowed compose shapes; ${blocked.length} blocked configuration/network/guard regressions`);
          NODE
      - name: Check the deployed helper timeout utility
        run: |
          docker run --rm --network none --read-only --entrypoint sh \
            coollabsio/coolify-helper@sha256:b0cf60e6d6ecc73696811fe105d7b187b0fa387bd8ec62c647177420daf42bad \
            -c 'timeout -k 1s 1s true && { timeout -k 1s 1s sh -c '\''trap "" TERM; while :; do sleep 1; done'\''; result=$?; test "$result" -eq 137; }'
      - name: Prove private files are excluded from the build context
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          test ! -e .env.context-probe
          test ! -e deploy/arkx/.env.context-probe
          test ! -e deploy/arkx/context-probe.key
          printf 'synthetic-context-probe' > .env.context-probe
          printf 'synthetic-context-probe' > deploy/arkx/.env.context-probe
          printf 'synthetic-context-probe' > deploy/arkx/context-probe.key
          printf 'FROM scratch\nCOPY . /source\n' > "$RUNNER_TEMP/context-probe.Dockerfile"
          docker build --file "$RUNNER_TEMP/context-probe.Dockerfile" --output "type=local,dest=$RUNNER_TEMP/context-export" .
          test ! -e "$RUNNER_TEMP/context-export/source/.env.context-probe"
          test ! -e "$RUNNER_TEMP/context-export/source/deploy/arkx/.env.context-probe"
          test ! -e "$RUNNER_TEMP/context-export/source/deploy/arkx/context-probe.key"
          test -f "$RUNNER_TEMP/context-export/source/.env.example"
          test -f "$RUNNER_TEMP/context-export/source/deploy/arkx/.env.example"
          rm .env.context-probe deploy/arkx/.env.context-probe deploy/arkx/context-probe.key
      - name: Set up the shared image builder
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Cache locked dependencies without application source
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile.dev
          target: dependencies
          platforms: linux/amd64
          push: false
          cache-from: type=gha,version=2,scope=arkx-publisher-amd64-pnpm10
          cache-to: type=gha,version=2,scope=arkx-publisher-amd64-pnpm10,mode=min
      - name: Build the source without production credentials
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_VERSION=v2.25.3
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Ark-x-AI-Lab/postiz-app
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Prove Prisma is usable offline in the runtime image
        env:
          IMAGE: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
        run: |
          ENGINE_CHECK=$(python3 -c "import importlib.util; s=importlib.util.spec_from_file_location('rehearsal', 'deploy/arkx/rehearse-migration.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(m.toolcheck_program())")
          ENGINE_RESULT=$(docker run --rm --network none --read-only --user 65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint node "$IMAGE" -e "$ENGINE_CHECK")
          test "$ENGINE_RESULT" = TOOLS_OK
          docker run --rm --network none --read-only --user 65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint node "$IMAGE" /app/node_modules/prisma/build/index.js --version
      - name: Check production process entrypoints in the runtime image
        env:
          IMAGE: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
        run: |
          docker run --rm --network none --read-only --user 65534:65534 \
            --entrypoint sh "$IMAGE" -n /app/deploy/arkx/runtime-start.sh
          docker run --rm --network none --read-only --user 65534:65534 \
            --entrypoint node "$IMAGE" --check /app/deploy/arkx/ecosystem.config.cjs
          docker run --rm -i --network none --read-only --user 65534:65534 \
            --cap-drop=ALL --security-opt no-new-privileges --entrypoint node "$IMAGE" - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const { apps } = require('/app/deploy/arkx/ecosystem.config.cjs');
          assert.deepEqual(apps.map(app => app.name).sort(), ['backend', 'frontend', 'orchestrator']);
          fs.accessSync('/usr/local/bin/pm2-runtime', fs.constants.X_OK);
          for (const app of apps) {
            assert.equal(app.interpreter, 'node');
            assert.equal(app.exec_mode, 'fork');
            assert.equal(app.instances, 1);
            assert.deepEqual(app.env, { NODE_ENV: 'production' });
            assert(fs.statSync(app.cwd).isDirectory());
            const script = path.resolve(app.cwd, app.script);
            assert(fs.statSync(script).isFile());
            execFileSync(process.execPath, ['--check', script], { stdio: 'pipe' });
            assert.equal(fs.existsSync(path.join(app.cwd, '.env')), false);
          }
          assert.equal(fs.existsSync('/app/.env'), false);
          console.log('PASS: three direct Node entrypoints and PM2 runtime exist; scripts parse offline; no runtime .env files');
          NODE
      - name: Prove service environment separation in the built image
        env:
          IMAGE: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
        run: |
          python3 -c "import json; x=json.load(open('deploy/arkx/compose.production.yaml')); [s.update(env_file=['.env']) for s in x['services'].values()]; json.dump(x, open('$RUNNER_TEMP/injected-compose.json','w'))"
          docker run --rm -i --network none --read-only --user 65534:65534 \
            --cap-drop=ALL --security-opt no-new-privileges --entrypoint node "$IMAGE" \
            /app/deploy/arkx/prepare-compose.cjs < "$RUNNER_TEMP/injected-compose.json" > "$RUNNER_TEMP/prepared-compose.json"
          python3 -c "import json; assert json.load(open('$RUNNER_TEMP/prepared-compose.json')) == json.load(open('deploy/arkx/compose.production.yaml'))"
      - name: Check connector diagnostics and analytics with pinned runtime dependencies
        env:
          IMAGE: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
        run: |
          docker run --rm --network none --read-only --user 65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint node "$IMAGE" --test \
            /app/libraries/nestjs-libraries/src/integrations/linkedin.oauth.diagnostics.test.cjs \
            /app/libraries/nestjs-libraries/src/integrations/post-analytics.test.cjs
      - name: Check private registration with pinned runtime dependencies
        env:
          IMAGE: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
        run: |
          docker run --rm --network none --read-only --user 65534:65534 \
            --cap-drop=ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint node "$IMAGE" --test \
            /app/deploy/arkx/private-registration.test.cjs \
            /app/deploy/arkx/private-registration-ui.test.cjs
      - name: Check runtime tools and final image payload
        env:
          IMAGE: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
        run: |
          docker run --rm --network none --read-only --user 65534:65534 --entrypoint pnpm "$IMAGE" --version
          docker run --rm --network none --read-only --user 65534:65534 --entrypoint nginx "$IMAGE" -v
          docker run --rm --network none --read-only --user 65534:65534 --entrypoint node "$IMAGE" -e "const fs=require('node:fs'); fs.accessSync('/usr/local/bin/pm2',fs.constants.X_OK); if(fs.existsSync('/app/apps/frontend/.next/cache/turbopack')) throw new Error('Build cache shipped'); if(fs.existsSync('/pnpm/store')) throw new Error('Dependency download store shipped'); for(const p of ['/app/apps/frontend/.next/server','/app/apps/frontend/.next/static']) if(!fs.existsSync(p)) throw new Error('Compiled frontend missing'); require('/usr/local/lib/node_modules/pm2/package.json'); require('@temporalio/worker'); require('sharp'); console.log('RUNTIME_MODULES_OK');"
          set -o pipefail
          bytes=$(docker image save "$IMAGE" | wc -c)
          bytes=$(echo "$bytes" | tr -d '[:space:]')
          [[ "$bytes" =~ ^[0-9]+$ && "$MAX_IMAGE_ARCHIVE_BYTES" =~ ^[1-9][0-9]+$ ]]
          printf 'IMAGE_ARCHIVE_BYTES=%s MAX_IMAGE_ARCHIVE_BYTES=%s\n' "$bytes" "$MAX_IMAGE_ARCHIVE_BYTES"
          test "$bytes" -le "$MAX_IMAGE_ARCHIVE_BYTES"
      - name: Check native modules and content parsing offline in the runtime image
        env:
          IMAGE: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
        run: |
          docker run --rm --network none --read-only --user 65534:65534 \
            --cap-drop=ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint node "$IMAGE" --test /app/deploy/arkx/native-runtime.test.cjs
      - name: Publish the commit image to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/ark-x-ai-lab/postiz-app:sha-${{ github.sha }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/arkx-publish-docker"
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          docker push "$IMAGE"
